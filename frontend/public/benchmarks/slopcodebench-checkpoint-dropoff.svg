<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Line chart of SlopCodeBench core solve rate by checkpoint, checkpoints 1 to 8, with one line per arm: baseline Codex 5.5 (white), Git Ship Done (blue), Oh My ClaudeCode (teal), Superpowers-v5 (amber), Karpathy Skills (pink), Agent Skills (orange). All arms start near 74 to 82 percent at checkpoint 1 and decline to roughly 44 to 50 percent by checkpoint 8. The five skill arms track the baseline the whole way down; none separates from it. The number of problems falls from 36 at checkpoint 1 to 6 at checkpoint 8, so the later checkpoints are noisier.">
  <!-- panel -->
  <rect x="0.5" y="0.5" width="759" height="469" rx="12" fill="#101e33" stroke="#1e3354"/>

  <!-- title -->
  <text x="70" y="30" fill="#e8edf5" font-size="17" font-weight="700">SlopCodeBench: solve rate erodes over checkpoints</text>
  <text x="70" y="49" fill="#94a3c0" font-size="12.5">Every arm declines together — no skill separates from the baseline</text>

  <!-- y gridlines + tick labels (Core solve %) -->
  <g stroke="#1e3354" stroke-width="1">
    <line x1="70" y1="101.8" x2="720" y2="101.8"/>
    <line x1="70" y1="173.3" x2="720" y2="173.3"/>
    <line x1="70" y1="244.9" x2="720" y2="244.9"/>
    <line x1="70" y1="316.4" x2="720" y2="316.4"/>
  </g>
  <g fill="#94a3c0" font-size="11" text-anchor="end">
    <text x="60" y="105.8">80%</text>
    <text x="60" y="177.3">70%</text>
    <text x="60" y="248.9">60%</text>
    <text x="60" y="320.4">50%</text>
    <text x="60" y="391.8">40%</text>
  </g>

  <!-- axes -->
  <g stroke="#2a4570" stroke-width="1.5">
    <line x1="70" y1="66" x2="70" y2="388"/>
    <line x1="70" y1="388" x2="720" y2="388"/>
  </g>

  <!-- skill arm lines (drawn first, baseline on top) -->
  <g fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <polyline stroke="#5aa2f0" points="90,97.5 177.1,170.5 264.3,170.5 351.4,196.9 438.6,196.9 525.7,214.1 612.9,316.4 700,356.5"/>
    <polyline stroke="#17a06f" points="90,144.0 177.1,230.6 264.3,196.9 351.4,254.9 438.6,249.9 525.7,180.5 612.9,316.4 700,356.5"/>
    <polyline stroke="#e0a91e" points="90,151.1 177.1,196.9 264.3,196.9 351.4,240.6 438.6,223.4 525.7,214.1 612.9,316.4 700,316.4"/>
    <polyline stroke="#ef7fae" points="90,137.6 177.1,210.5 264.3,144.0 351.4,226.3 438.6,223.4 525.7,248.5 612.9,346.5 700,316.4"/>
    <polyline stroke="#db5a3a" points="90,131.1 177.1,204.1 264.3,204.1 351.4,233.4 438.6,223.4 525.7,196.9 612.9,346.5 700,356.5"/>
  </g>
  <!-- baseline (bold white, on top) -->
  <polyline points="90,91.1 177.1,204.1 264.3,151.1 351.4,211.9 438.6,196.9 525.7,231.3 612.9,316.4 700,356.5"
            fill="none" stroke="#f4f7fb" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- per-checkpoint markers (colored, thin surface ring) -->
  <g stroke="#101e33" stroke-width="1">
    <g fill="#5aa2f0"><circle cx="90" cy="97.5" r="2.6"/><circle cx="177.1" cy="170.5" r="2.6"/><circle cx="264.3" cy="170.5" r="2.6"/><circle cx="351.4" cy="196.9" r="2.6"/><circle cx="438.6" cy="196.9" r="2.6"/><circle cx="525.7" cy="214.1" r="2.6"/><circle cx="612.9" cy="316.4" r="2.6"/><circle cx="700" cy="356.5" r="2.6"/></g>
    <g fill="#17a06f"><circle cx="90" cy="144.0" r="2.6"/><circle cx="177.1" cy="230.6" r="2.6"/><circle cx="264.3" cy="196.9" r="2.6"/><circle cx="351.4" cy="254.9" r="2.6"/><circle cx="438.6" cy="249.9" r="2.6"/><circle cx="525.7" cy="180.5" r="2.6"/><circle cx="612.9" cy="316.4" r="2.6"/><circle cx="700" cy="356.5" r="2.6"/></g>
    <g fill="#e0a91e"><circle cx="90" cy="151.1" r="2.6"/><circle cx="177.1" cy="196.9" r="2.6"/><circle cx="264.3" cy="196.9" r="2.6"/><circle cx="351.4" cy="240.6" r="2.6"/><circle cx="438.6" cy="223.4" r="2.6"/><circle cx="525.7" cy="214.1" r="2.6"/><circle cx="612.9" cy="316.4" r="2.6"/><circle cx="700" cy="316.4" r="2.6"/></g>
    <g fill="#ef7fae"><circle cx="90" cy="137.6" r="2.6"/><circle cx="177.1" cy="210.5" r="2.6"/><circle cx="264.3" cy="144.0" r="2.6"/><circle cx="351.4" cy="226.3" r="2.6"/><circle cx="438.6" cy="223.4" r="2.6"/><circle cx="525.7" cy="248.5" r="2.6"/><circle cx="612.9" cy="346.5" r="2.6"/><circle cx="700" cy="316.4" r="2.6"/></g>
    <g fill="#db5a3a"><circle cx="90" cy="131.1" r="2.6"/><circle cx="177.1" cy="204.1" r="2.6"/><circle cx="264.3" cy="204.1" r="2.6"/><circle cx="351.4" cy="233.4" r="2.6"/><circle cx="438.6" cy="223.4" r="2.6"/><circle cx="525.7" cy="196.9" r="2.6"/><circle cx="612.9" cy="346.5" r="2.6"/><circle cx="700" cy="356.5" r="2.6"/></g>
    <g fill="#f4f7fb" stroke-width="1.4"><circle cx="90" cy="91.1" r="3"/><circle cx="177.1" cy="204.1" r="3"/><circle cx="264.3" cy="151.1" r="3"/><circle cx="351.4" cy="211.9" r="3"/><circle cx="438.6" cy="196.9" r="3"/><circle cx="525.7" cy="231.3" r="3"/><circle cx="612.9" cy="316.4" r="3"/><circle cx="700" cy="356.5" r="3"/></g>
  </g>

  <!-- legend (masks the gridline behind it) -->
  <rect x="256" y="72" width="456" height="44" rx="6" fill="#101e33" stroke="#1e3354"/>
  <g font-size="11.5" fill="#c3cee0">
    <line x1="266" y1="88" x2="284" y2="88" stroke="#f4f7fb" stroke-width="2.6"/><text x="290" y="92">baseline Codex 5.5</text>
    <line x1="420" y1="88" x2="438" y2="88" stroke="#5aa2f0" stroke-width="2.4"/><text x="444" y="92">Git Ship Done</text>
    <line x1="574" y1="88" x2="592" y2="88" stroke="#17a06f" stroke-width="2.4"/><text x="598" y="92">Oh My ClaudeCode</text>
    <line x1="266" y1="107" x2="284" y2="107" stroke="#e0a91e" stroke-width="2.4"/><text x="290" y="111">Superpowers-v5</text>
    <line x1="420" y1="107" x2="438" y2="107" stroke="#ef7fae" stroke-width="2.4"/><text x="444" y="111">Karpathy Skills</text>
    <line x1="574" y1="107" x2="592" y2="107" stroke="#db5a3a" stroke-width="2.4"/><text x="598" y="111">Agent Skills</text>
  </g>

  <!-- x tick labels: checkpoint number -->
  <g fill="#c3cee0" font-size="12" text-anchor="middle">
    <text x="90" y="407">1</text><text x="177.1" y="407">2</text><text x="264.3" y="407">3</text><text x="351.4" y="407">4</text>
    <text x="438.6" y="407">5</text><text x="525.7" y="407">6</text><text x="612.9" y="407">7</text><text x="700" y="407">8</text>
  </g>

  <!-- problems-per-checkpoint row (shrinking, noisier sample) -->
  <text x="62" y="426" fill="#6b7fa0" font-size="10.5" text-anchor="end"># problems</text>
  <g fill="#6b7fa0" font-size="10.5" text-anchor="middle">
    <text x="90" y="426">36</text><text x="177.1" y="426">36</text><text x="264.3" y="426">36</text><text x="351.4" y="426">33</text>
    <text x="438.6" y="426">27</text><text x="525.7" y="426">14</text><text x="612.9" y="426">8</text><text x="700" y="426">6</text>
  </g>

  <!-- axis titles -->
  <text x="395" y="452" fill="#c3cee0" font-size="12.5" text-anchor="middle">Checkpoint</text>
  <text x="22" y="227" fill="#c3cee0" font-size="12.5" text-anchor="middle" transform="rotate(-90 22 227)">Core solve %</text>
</svg>
